<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'"><title>Markora</title></head><body>
<div id="bot-root">
  <section id="voice-panel" hidden aria-label="Pen and voice controls">
    <header><button id="voice-back" aria-label="Back to tools" title="Back to tools"><span class="ui-icon" data-icon="back"></span></button><strong id="voice-phase">Pen + voice</strong><button id="voice-settings" aria-label="Voice settings" title="Voice settings"><span class="ui-icon" data-icon="settings"></span></button></header>
    <nav id="pen-controls" class="pen-controls" aria-label="Selection tools"><span>Select</span><div role="group" aria-label="Selection mode"><button data-mode="auto" aria-pressed="true" title="Choose text or an element from your mark">Auto</button><button data-mode="text" aria-pressed="false" title="Select only the letters you mark">Text</button><button data-mode="element" aria-pressed="false" title="Select a whole element">Element</button></div><button id="pen-clear" title="Clear the current mark">Clear</button></nav>
    <div id="voice-selection" class="voice-selection" hidden><span id="voice-selection-label"></span><small id="voice-selection-source"></small></div>
    <p id="voice-message" role="status" aria-live="polite"></p><meter id="voice-meter" min="0" max="1" value="0" aria-label="Microphone level"></meter>
    <textarea id="voice-transcript" aria-label="Recognized words" rows="2" maxlength="6000" hidden></textarea>
    <div class="voice-actions"><button id="voice-finish" hidden>Finish</button><button id="voice-apply" hidden>Apply change</button><button id="voice-retry">Retry</button><button id="voice-stop">Stop</button><button id="voice-undo">Undo</button><button id="voice-redo">Redo</button></div>
    <p class="pen-help" id="pen-help">Mark the page and say your change. Esc returns to browsing.</p>
  </section>
  <nav id="radial-menu" aria-label="Bot tools" hidden><div class="orbit-ring"></div><div id="radial-tools"></div><button id="radial-settings" class="mini-tool" title="Settings"><span class="ui-icon" data-icon="settings"></span></button><button id="radial-close" class="mini-tool" title="Close bot"><span class="ui-icon" data-icon="close"></span></button></nav>
  <section id="tool-panel" hidden>
    <header><button id="bot-back" title="Back to tools"><span class="ui-icon" data-icon="back"></span></button><div><strong>Markora <small>workspace</small></strong><span id="bot-provider">Your project assistant</span></div><button id="collapse" title="Minimize bot" aria-label="Minimize bot"><span class="ui-icon" data-icon="minus"></span></button></header>
    <button id="folder-label" class="folder-label"><span class="ui-icon" data-icon="folder"></span><span id="folder-name">Choose your website folder</span><span>⌄</span></button>
    <div class="tools">
      <button id="magic-voice" class="tool"><span><span class="ui-icon" data-icon="pen"></span></span><strong>Pen + voice</strong><small>Select and speak.</small></button>
      <button id="text-tool" class="tool"><span><span class="ui-icon" data-icon="text"></span></span><strong>Text input</strong><small>Describe your idea.</small></button>
      <button id="folder-tool" class="tool"><span><span class="ui-icon" data-icon="folder"></span></span><strong>Folder</strong><small id="bot-doc-count">Choose a workspace.</small></button>
      <button id="preview-tool" class="tool"><span><span class="ui-icon" data-icon="browser"></span></span><strong>Live preview</strong><small>Open your website.</small></button>
      <button id="undo-tool" class="tool undo-tool"><span><span class="ui-icon" data-icon="undo"></span></span><strong>Undo change</strong><small>One step back.</small></button>
    </div>
    <div id="bot-selection" hidden><div><strong>Selected</strong><span id="bot-selection-label"></span></div><button id="bot-clear" title="Clear selection"><span class="ui-icon" data-icon="close"></span></button></div>
    <form id="bot-command-form"><label id="bot-prompt" for="bot-command">What should we create?</label><textarea id="bot-command" rows="2" placeholder="Build a portfolio from the documents in this folder…"></textarea><div class="input-actions"><button type="button" id="bot-mic" title="Speak a command" aria-label="Speak a command"><span class="ui-icon" data-icon="mic"></span><span id="mic-label">Speak</span></button><button type="submit" id="bot-send">Make a plan ↗</button></div></form>
    <div id="bot-plan" hidden><strong id="bot-plan-title"></strong><p id="bot-plan-summary"></p><p id="bot-direction" hidden></p><div id="bot-sections"></div><button id="bot-build">Build this website ↗</button></div>
    <div class="bot-status" aria-live="polite"><div><span id="bot-status-symbol">✧</span><span id="bot-status">Ready.</span><button id="bot-cancel" hidden>Cancel</button></div><div class="progress-track"><i id="bot-progress"></i></div></div>
    <div id="bot-notice" role="status" hidden></div>
    <footer><button id="bot-settings"><span class="ui-icon" data-icon="settings"></span>Settings</button><button id="bot-redo" title="Redo"><span class="ui-icon" data-icon="redo"></span>Redo</button><button id="bot-export" title="Export website"><span class="ui-icon" data-icon="download"></span>Export</button><button id="bot-close"><span class="ui-icon" data-icon="close"></span>Close</button></footer>
  </section>
  <div class="pet-dock"><button id="pet-button" aria-label="Open tools; drag to move" title="Click for tools. Drag to move."><svg class="pet" viewBox="0 0 160 140" aria-hidden="true"><defs><linearGradient id="shell" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#e5f7cd"/><stop offset=".52" stop-color="#c8e8a8"/><stop offset="1" stop-color="#aaca88"/></linearGradient><linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#344c3f"/><stop offset="1" stop-color="#1f342a"/></linearGradient></defs><ellipse class="pet-shadow" cx="80" cy="130" rx="38" ry="5" fill="#14261c" opacity=".14"/><path class="pet-arm arm-left" d="M37 73Q18 78 23 93" fill="none" stroke="#b5d992" stroke-width="11" stroke-linecap="round"/><path class="pet-arm arm-right" d="M123 73Q142 72 139 56" fill="none" stroke="#b5d992" stroke-width="11" stroke-linecap="round"/><g class="pet-body"><path d="M65 107v13M95 107v13" stroke="#9ebc80" stroke-width="12" stroke-linecap="round"/><path d="M80 29V16" stroke="#9ebc80" stroke-width="4" stroke-linecap="round"/><path class="pet-leaf" d="M80 18C77 6 84 1 96 4C98 16 88 21 80 18Z" fill="#d7efba" stroke="#8da670" stroke-width="1.5"/><rect x="34" y="27" width="92" height="85" rx="31" fill="url(#shell)" stroke="#8da871" stroke-width="1.2"/><path d="M44 43Q46 34 60 33h40" fill="none" stroke="#f6ffe9" stroke-width="2" opacity=".8" stroke-linecap="round"/><rect x="44" y="41" width="72" height="49" rx="19" fill="url(#face)"/><g class="pet-look"><g class="eyes"><rect x="58" y="53" width="12" height="16" rx="6" fill="#d9f5b7"/><rect x="90" y="53" width="12" height="16" rx="6" fill="#d9f5b7"/></g><path d="M73 76Q80 81 87 76" fill="none" stroke="#c6e6a4" stroke-width="2.5" stroke-linecap="round"/></g><circle class="pet-indicator" cx="80" cy="100" r="2.5" fill="#486c3e"/><path d="M55 112h50" stroke="#98b778" stroke-width="1" opacity=".5"/></g></svg></button><span id="pet-caption">Open workspace</span></div>
</div><script type="module" src="./bot.js"></script></body></html>
